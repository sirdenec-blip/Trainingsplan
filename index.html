<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trainingsplan</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1c1c1a;--mu:#777;--ac:#1d6b4f;--ye:#b8860b;--u1:#9ad9b6;--u1t:#0f2a1d;--u2:#1d6b4f;--u2t:#fff;--bd:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#222221;--tx:#eee;--mu:#999;--ac:#4cc29a;--ye:#f2c94c;--u1:#2f7d5c;--u1t:#fff;--u2:#7ee2b8;--u2t:#0b2a1e;--bd:#3a3a38}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;max-width:520px;margin:auto}
h1{font-size:1.3rem;margin:.2rem 0 1rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mu);margin:12px 0 4px}
input,select,button{font:inherit;width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input.bad{border-color:#c33}
button{background:var(--ac);color:#fff;border:0;margin-top:14px;font-weight:600}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd);margin-top:8px;font-weight:400}
.row{display:flex;gap:8px}.row>*{flex:1}
.in{display:flex;gap:8px;align-items:center}
.in .w{flex:0 0 84px;text-align:center}
.in .r{flex:1}
.in span{color:var(--mu);white-space:nowrap}
.in .add{flex:0 0 48px;margin:0;padding:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:32px;align-items:center}
.chip{background:var(--ac);color:#fff;border-radius:16px;padding:4px 12px;font-weight:600;cursor:pointer}
.chip.empty{background:transparent;color:var(--mu);border:1px dashed var(--bd);font-weight:400;cursor:default}
.tot{color:var(--mu);font-size:.85rem;margin-left:4px}
.h{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px}
.h small{color:var(--mu);font-weight:400}
.l{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-variant-numeric:tabular-nums}
.l span:first-child{color:var(--mu)}.l span:last-child{text-align:right}
.x{width:auto;background:none;color:var(--mu);border:0;margin:0;padding:0 4px}
#gate{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;padding:16px;overflow:auto}#gate[hidden]{display:none}#gate>div{max-width:520px;margin:8vh auto 0}#exm,#imp{margin-top:10px;font-size:.9rem;line-height:1.4}#editbar{color:var(--ye);font-weight:600;font-size:.9rem;margin-bottom:8px}.card.ed,.card.editing{border-color:var(--ye)}.card.editing #save{background:var(--ye);color:#1c1c1a}.card.ref{border:2px dashed var(--ac);padding:13px}details.card>summary{cursor:pointer;font-weight:600}
.sub{color:var(--mu);font-size:.85rem;margin:12px 0 6px}
.calh{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:8px}
.calh button{width:auto;margin:0;background:none;border:0;color:var(--tx);font-size:1.4rem;padding:0 12px;line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{color:var(--mu);font-size:.75rem}
.cal .d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:.85rem;font-variant-numeric:tabular-nums}
.d.u1{background:var(--u1);color:var(--u1t)}.d.u2{background:var(--u2);color:var(--u2t)}
.d.both{background:linear-gradient(135deg,var(--u1) 50%,var(--u2) 50%);color:#fff;text-shadow:0 0 3px rgba(0,0,0,.7)}
.d.today{outline:2px solid var(--tx);outline-offset:-2px}
.leg{display:flex;gap:14px;font-size:.8rem;color:var(--mu);margin-top:10px;flex-wrap:wrap}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.sat{color:var(--mu);font-size:.8rem;margin-right:2px}
.chip i{font-style:normal;font-size:.7rem;opacity:.75;margin-right:6px}
.chip.empty.nx{border-color:var(--ac);color:var(--ac)}
.ex{padding:7px 0;border-top:1px solid var(--bd)}.ex:first-of-type{border-top:0}
.en{color:var(--mu);font-size:.85rem}.ln{display:flex;align-items:center;gap:10px;margin-top:3px}.ln b{flex:0 0 6.8rem;font-variant-numeric:tabular-nums}
.sets{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:1}
.sets small{color:var(--mu);font-size:.75rem}
.sets span{background:var(--bg);border:1px solid var(--bd);border-radius:10px;min-width:28px;text-align:center;padding:1px 8px;font-size:.85rem;font-variant-numeric:tabular-nums}
.inf{color:var(--mu);cursor:pointer;margin-left:6px;font-size:.95rem}.fi{color:var(--mu);font-size:.85rem;margin:-6px 0 12px}.fi b{color:var(--tx);font-weight:600}.ver{text-align:center;color:var(--mu);font-size:.8rem;margin:4px 0 20px}#gate p{color:var(--mu);line-height:1.4;font-size:.9rem}#note{color:var(--mu);font-size:.85rem;margin-top:6px}
#msg{color:#c33;font-size:.85rem;min-height:1.2em;margin-top:8px}
</style>
</head>
<body>
<div id="gate" hidden><div class="card">
  <h1 style="margin-top:0">Trainingstagebuch</h1>
  <p>Exportiert deine Einträge in eine Datei. Bei einer bestehenden Datei werden neue, geänderte und gelöschte Einträge in beide Richtungen abgeglichen (die neuere Änderung gewinnt).</p>
  <button id="exNew" style="margin-top:6px">Neue Datei erstellen</button>
  <button class="sec" id="exOld">Bestehende Datei auswählen</button>
  <button class="sec" id="exClose">Schließen</button>
  <div id="exm"></div>
</div></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<h1>🏋️ Trainingsplan</h1>
<div class="fi" id="fileind"></div>
<div class="card">
  <div id="editbar" hidden></div>
  <div class="row">
    <div><label style="margin-top:0">Datum</label><input type="date" id="date"></div>
    <div><label style="margin-top:0">Einheit</label><select id="unit"><option value="1">Einheit 1</option><option value="2">Einheit 2</option></select></div>
  </div>
  <div id="fields"></div>
  <div id="msg"></div><div id="note"></div>
  <button id="save">Speichern</button>
  <button class="sec" id="cancel" hidden>Bearbeiten abbrechen</button>
</div>

<details class="card" id="ausw">
  <summary>📊 Auswertungen</summary>
  <div class="sub">Kalenderübersicht</div>
  <div class="calh"><button id="cprev" aria-label="Voriger Monat">‹</button><span id="cmon"></span><button id="cnext" aria-label="Nächster Monat">›</button></div>
  <div class="cal" id="cal"></div>
  <div class="leg"><span><i style="background:var(--u1)"></i>Einheit 1</span><span><i style="background:var(--u2)"></i>Einheit 2</span><span id="ccount" style="margin-left:auto"></span></div>
</details>

<div id="hist"></div>

<div class="card">
  <button id="tag" style="margin-top:0">📔 Trainingstagebuch exportieren</button>
  <button class="sec" id="tagIn">📥 Trainingstagebuch importieren</button>
  <div id="imp"></div>
  <button class="sec" id="exp">Als lesbaren Text herunterladen</button>
</div>

<div class="ver" id="ver"></div>

<script>
const VERSION="0.19";
// s = Anzahl Sätze (0 = variabel), max = höchste Wiederholungszahl
const PLAN={
  1:[{n:"Kniebeugen",s:3},{n:"Bankdrücken",s:3},{n:"Vorgebeugtes Rudern",s:3}],
  2:[{n:"Kreuzheben",s:3},{n:"Overhead-Press",s:3},{n:"Klimmzüge",s:0,max:12,w0:"0",goal:24}]
};
const $=id=>document.getElementById(id);
let data=[],st=[];

// ---------- Speicher im Browser ----------
const KEY="trainingsplan_v1";
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){$("note").textContent="⚠ Browserspeicher nicht verfügbar – bitte regelmäßig exportieren.";return false}};
try{data=collapse(JSON.parse(localStorage.getItem(KEY)||"[]").map(norm));persist()}catch(e){}

// ---------- Trainingstagebuch (Datei) ----------
const pack=d=>JSON.stringify({version:2,sessions:d},null,1);
function unpack(t){
  if(!t.trim())return [];
  const j=JSON.parse(t),a=Array.isArray(j)?j:j&&j.sessions;
  if(!Array.isArray(a))throw new Error("Das ist keine gültige Trainingsdatei.");
  return a.filter(x=>x&&x.date&&x.unit&&x.ex&&typeof x.ex==="object").map(norm);
}
function sig(x){return x.date+"|"+x.unit+"|"+JSON.stringify(Object.entries(x.ex).sort())}
function hash(str){ // einfacher 53-Bit-Hash (cyrb53)
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
const newId=()=>"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
// Alt-Einträge (Zahlen-ID) bekommen eine ID, die aus dem Inhalt abgeleitet wird:
// derselbe Eintrag in Browser und Datei erhält so dieselbe ID.
function norm(x){
  if(typeof x.id==="string"&&x.ts)return x;
  const o={id:"l"+hash(sig(x)),date:x.date,unit:+x.unit,ex:x.ex,ts:(typeof x.id==="number"&&x.id>1e12)?x.id:0};
  if(x.del)o.del=true;
  return o;
}
function collapse(arr){const m=new Map();arr.forEach(x=>{const o=m.get(x.id);if(!o||x.ts>o.ts)m.set(x.id,x)});return[...m.values()]}
const cmp=(a,b)=>a.date.localeCompare(b.date)||(a.ts-b.ts);
const live=()=>data.filter(x=>!x.del);
// führt Browser-Daten und Datei-Daten zusammen: gleiche ID = gleicher Eintrag, neuere Änderung gewinnt
function merge(fileArr){
  const M=new Map(data.map(x=>[x.id,x])),F=new Map(fileArr.map(x=>[x.id,x])),out=new Map();
  let nf=0,nb=0;
  new Set([...M.keys(),...F.keys()]).forEach(id=>{
    const a=M.get(id),b=F.get(id);
    if(!b){out.set(id,a);if(!a.del)nf++;return}
    if(!a){out.set(id,b);if(!b.del)nb++;return}
    const same=sig(a)===sig(b)&&!!a.del===!!b.del;
    if(same){out.set(id,b.ts>a.ts?b:a);return}
    if(b.ts>a.ts){out.set(id,b);nb++}else if(a.ts>b.ts){out.set(id,a);nf++}else out.set(id,a);
  });
  return{all:[...out.values()].sort(cmp),nf,nb};
}
// Zuletzt verwendete Tagebuch-Datei merken und anzeigen
const FKEY="trainingsplan_file";
function setFile(name,action){
  try{localStorage.setItem(FKEY,JSON.stringify({name,action,ts:Date.now()}))}catch(e){}
  renderFile();
}
function renderFile(){
  let f=null;try{f=JSON.parse(localStorage.getItem(FKEY)||"null")}catch(e){}
  const el=$("fileind");
  if(!f){el.textContent="📄 Keine Datei verknüpft – Daten nur im Browser";return}
  const t=new Date(f.ts).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  el.innerHTML="📄 Datei: <b></b> · "+f.action+" "+t;
  el.querySelector("b").textContent=f.name;
}
let mode="export";
const exm=(t,bad)=>{$("exm").style.color=bad?"#c33":"var(--tx)";$("exm").textContent=t};
async function write(h,text){const w=await h.createWritable();await w.write(text);await w.close()}
const FSA="showSaveFilePicker" in window&&"showOpenFilePicker" in window;
const PICK={types:[{description:"Trainingstagebuch (JSON)",accept:{"application/json":[".json"]}}]};

async function exportNew(){
  try{
    if(FSA){const h=await showSaveFilePicker({suggestedName:"Trainingstagebuch.json",...PICK});await write(h,pack(data));setFile(h.name,"exportiert");exm(`Gespeichert: ${live().length} Einträge in „${h.name}“.`)}
    else{dl("Trainingstagebuch.json",pack(data),"application/json");setFile("Trainingstagebuch.json","exportiert");exm(`Heruntergeladen: Trainingstagebuch.json mit ${live().length} Einträgen.`)}
  }catch(e){if(e.name!=="AbortError")exm("Fehler: "+(e.message||e),1)}
}
function done(m,nf,nb){
  data=m.all;persist();refresh();
  return `${nb} neue oder geänderte Einträge in den Browser übernommen, ${nf} in die Datei. Insgesamt ${live().length} Einträge.`;
}
async function exportOld(){
  try{
    if(FSA){
      const[h]=await showOpenFilePicker(PICK);
      const m=merge(unpack(await(await h.getFile()).text()));
      await write(h,pack(m.all));setFile(h.name,"abgeglichen");
      exm(done(m,m.nf,m.nb)+` Datei „${h.name}“ aktualisiert.`);
    }else{mode="export";$("file").click()}
  }catch(e){if(e.name!=="AbortError")exm("Fehler: "+(e.message||e),1)}
}
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    if(mode==="import"){
      const fa=unpack(r.result),m=merge(fa);
      data=m.all;persist();refresh();setFile(f.name,"importiert");
      const imp=$("imp");imp.style.color="var(--tx)";
      imp.textContent=`Import: ${m.nb} neue oder geänderte Einträge übernommen. Insgesamt ${live().length} Einträge.`;
      return;
    }
    const m=merge(unpack(r.result));
    const msg=done(m,m.nf,m.nb);setFile(f.name,"abgeglichen");
    dl("Trainingstagebuch.json",pack(m.all),"application/json");
    exm(msg+" Dein Browser darf die Datei nicht überschreiben: die ergänzte Version wurde neu heruntergeladen – ersetze damit die alte Datei.");
  }catch(x){if(mode==="import"){const imp=$("imp");imp.style.color="#c33";imp.textContent="Fehler: "+(x.message||x)}else exm("Fehler: "+(x.message||x),1)}};
  r.readAsText(f);e.target.value="";
};
$("tagIn").onclick=()=>{mode="import";$("imp").textContent="";$("file").click()};
$("ver").textContent="Version "+VERSION;renderFile();
$("tag").onclick=()=>{exm("");$("gate").hidden=false};
$("exClose").onclick=()=>{$("gate").hidden=true};
$("exNew").onclick=exportNew;
$("exOld").onclick=exportOld;

// ---------- Eingabe ----------
const lastW=(u,name)=>{const L=live();for(let i=L.length-1;i>=0;i--)if(L[i].unit==u&&L[i].ex[name])return L[i].ex[name].split("x")[0];return null};
const sum=a=>a.reduce((x,y)=>x+y,0);

function build(){
  const u=$("unit").value;
  st=PLAN[u].map(e=>({w:lastW(u,e.n)??e.w0??"",reps:[]}));
  $("fields").innerHTML=PLAN[u].map((e,i)=>`
    <label>${e.n}${e.s?"":" (beliebig viele Sätze, Enter ohne Zahl = fertig)"}</label>
    <div class="in">
      <input class="w" data-i="${i}" inputmode="decimal" value="${st[i].w}" aria-label="Gewicht in kg"><span>kg ×</span>
      <input class="r" data-i="${i}" inputmode="numeric" enterkeyhint="next" placeholder="Wdh" autocomplete="off">
      <button class="add" data-i="${i}" type="button">＋</button>
    </div>
    <div class="chips" id="c${i}"></div>`).join("");
  PLAN[u].forEach((_,i)=>chips(i));
  document.querySelectorAll(".w").forEach(el=>{
    el.onfocus=()=>el.select();
    el.oninput=()=>st[el.dataset.i].w=el.value;
    el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();rIn(el.dataset.i).focus()}};
  });
  document.querySelectorAll(".r").forEach(el=>{
    el.onkeydown=e=>{
      const i=+el.dataset.i;
      if(e.key==="Enter"){e.preventDefault();commit(i)}
      else if(e.key==="Backspace"&&el.value===""&&st[i].reps.length){st[i].reps.pop();chips(i)}
    };
  });
  document.querySelectorAll(".add").forEach(b=>b.onclick=()=>{commit(+b.dataset.i)});
}
const rIn=i=>document.querySelector(`.r[data-i="${i}"]`);

function chips(i){
  const e=PLAN[$("unit").value][i],r=st[i].reps,n=r.length;
  let h=`<span class="sat">Satz</span>`+r.map((v,k)=>`<span class="chip" data-k="${k}" title="Antippen zum Entfernen"><i>${k+1}</i>${v}</span>`).join("");
  const slots=e.s?e.s:n+1;
  for(let k=n;k<slots;k++)h+=`<span class="chip empty${k===n?" nx":""}"><i>${k+1}</i>–</span>`;
  if(!e.s&&n)h+=`<span class="tot">Σ ${sum(r)}${e.goal?" / "+e.goal:""} Wdh.</span>`;
  const c=$("c"+i);c.innerHTML=h;
  c.querySelectorAll(".chip[data-k]").forEach(ch=>ch.onclick=()=>{st[i].reps.splice(+ch.dataset.k,1);chips(i)});
  const el=rIn(i);if(el)el.placeholder=(e.s&&n>=e.s)?"fertig":`Satz ${n+1}: Wdh.`;
}
function commit(i){
  const e=PLAN[$("unit").value][i],el=rIn(i),v=el.value.trim(),r=st[i].reps;
  $("msg").textContent="";
  if(v===""){if(!e.s&&r.length)next(i);return}
  const n=+v,max=e.max||99;
  if(!/^\d+$/.test(v)||n<1||n>max){$("msg").textContent=`${e.n}: Wiederholungen von 1 bis ${max} eingeben.`;el.select();return}
  if(e.s&&r.length>=e.s){next(i);return}
  r.push(n);el.value="";chips(i);
  if(e.s&&r.length===e.s)next(i);else el.focus();
}
function next(i){
  const nx=document.querySelector(`.w[data-i="${i+1}"]`);
  if(nx)nx.focus();else $("save").focus();
}
$("unit").onchange=()=>{build();render()};

$("save").onclick=()=>{
  const u=$("unit").value,ex={};let err="";
  PLAN[u].forEach((e,i)=>{
    const w=String(st[i].w).trim().replace(",","."),r=st[i].reps,ok=/^\d+(\.\d+)?$/.test(w);
    document.querySelector(`.w[data-i="${i}"]`).classList.toggle("bad",!ok);
    if(!ok)err=err||`${e.n}: Gewicht fehlt (bei Körpergewicht 0).`;
    else if(e.s&&r.length!==e.s)err=err||`${e.n}: ${e.s} Sätze nötig (bisher ${r.length}).`;
    else if(!e.s&&!r.length)err=err||`${e.n}: mindestens 1 Satz nötig.`;
    else ex[e.n]=(+w)+"x"+r.join("-");
  });
  $("msg").textContent=err;
  if(err)return;
  if(editId!==null){
    data=data.map(x=>{
      if(x.id!==editId)return x;
      const n={...x,date:$("date").value,unit:+u,ex};
      if(sig(n)===sig(x))return x; // nichts geändert
      return{...n,ts:Date.now(),ed:true};
    }).sort(cmp);
    const ok=persist();exitEdit();
    if(ok)$("note").textContent="✔ Änderung gespeichert.";
    window.scrollTo({top:0,behavior:"smooth"});
    return;
  }
  data=[...data,{id:newId(),date:$("date").value,unit:+u,ex,ts:Date.now()}].sort(cmp);
  const ok=persist();init();
  if(ok)$("note").textContent="✔ Gespeichert.";
  window.scrollTo({top:0,behavior:"smooth"});
};

let editId=null;
function edit(id){
  const e=live().find(x=>x.id===id);if(!e)return;
  editId=id;$("date").value=e.date;$("unit").value=e.unit;$("unit").disabled=true;build();
  PLAN[e.unit].forEach((p,i)=>{
    const v=e.ex[p.n];if(!v)return;
    const[w,r]=v.split("x");
    st[i].w=w;st[i].reps=r.split("-").map(Number);
    document.querySelector(`.w[data-i="${i}"]`).value=w;chips(i);
  });
  $("editbar").textContent=`✎ Bearbeite Eintrag vom ${fmt(e.date)} (Einheit ${e.unit})`;
  $("editbar").hidden=false;$("cancel").hidden=false;$("editbar").parentElement.classList.add("editing");$("save").textContent="Änderung speichern";
  $("msg").textContent="";$("note").textContent="";
  render();window.scrollTo({top:0,behavior:"smooth"});
}
function exitEdit(){
  editId=null;$("unit").disabled=false;$("editbar").hidden=true;$("cancel").hidden=true;$("editbar").parentElement.classList.remove("editing");
  $("save").textContent="Speichern";init();
}
$("cancel").onclick=exitEdit;
const wd=d=>new Date(d+"T12:00").toLocaleDateString("de-DE",{weekday:"short"}).replace(".","");
const fmt=d=>d.split("-").reverse().join(".");
let cal=null;
function calMove(n){const d=new Date(cal.y,cal.m+n,1);cal={y:d.getFullYear(),m:d.getMonth()};renderCal()}
function renderCal(){
  const now=new Date();if(!cal)cal={y:now.getFullYear(),m:now.getMonth()};
  const{y,m}=cal,pre=y+"-"+String(m+1).padStart(2,"0"),days=new Date(y,m+1,0).getDate(),off=(new Date(y,m,1).getDay()+6)%7;
  const by={};let n=0;
  live().forEach(x=>{if(x.date.slice(0,7)===pre){const d=+x.date.slice(8,10);(by[d]=by[d]||{})[x.unit]=1;n++}});
  const today=(now.getFullYear()===y&&now.getMonth()===m)?now.getDate():0;
  let h=["Mo","Di","Mi","Do","Fr","Sa","So"].map(t=>`<div class="wd">${t}</div>`).join("")+"<div></div>".repeat(off);
  for(let d=1;d<=days;d++){
    const u=by[d]||{},c=u[1]&&u[2]?"both":u[1]?"u1":u[2]?"u2":"";
    const tt=c?` title="${u[1]?"Einheit 1":""}${u[1]&&u[2]?" + ":""}${u[2]?"Einheit 2":""}"`:"";
    h+=`<div class="d ${c}${d===today?" today":""}"${tt}>${d}</div>`;
  }
  $("cal").innerHTML=h;
  $("cmon").textContent=new Date(y,m,1).toLocaleDateString("de-DE",{month:"long",year:"numeric"});
  $("ccount").textContent=n?`${n} Einheit${n>1?"en":""}`:"keine Einheit";
}
$("cprev").onclick=()=>calMove(-1);
$("cnext").onclick=()=>calMove(1);
function refId(){ // zuletzt eingetragene Einheit mit derselben Nummer (ohne den gerade bearbeiteten Eintrag)
  const u=+$("unit").value,L=live().filter(x=>x.unit===u&&x.id!==editId);
  return L.length?L[L.length-1].id:null;
}
function render(){
  const ref=refId();renderCal();
  $("hist").innerHTML=live().reverse().map(s=>
    `<div class="card${s.id===editId?" ed":""}${s.id===ref?" ref":""}"><div class="h"><span>${wd(s.date)} ${fmt(s.date)} <small>Einheit ${s.unit}</small>${s.ed?`<span class="inf" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden" title="Geändert">ⓘ</span><small hidden> geändert ${new Date(s.ts).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}</small>`:""}</span><span><button class="x" onclick="edit('${s.id}')" title="Bearbeiten">✎</button><button class="x" onclick="del('${s.id}')" title="Löschen">✕</button></span></div>`+
    Object.entries(s.ex).map(([k,v])=>{
      const[w,rs]=v.split("x"),reps=rs.split("-").map(Number);
      const wg=w.replace(".",","),kg=k==="Klimmzüge"?(+w?`+${wg} kg`:"Körpergewicht"):`${wg} kg`;
      return `<div class="ex"><div class="en">${k}</div><div class="ln"><b>${kg}</b><div class="sets"><small>Wiederholungen</small>${reps.map(x=>`<span>${x}</span>`).join("")}${k==="Klimmzüge"?`<small>Σ ${sum(reps)}</small>`:""}</div></div></div>`}).join("")+`</div>`).join("");
}
function del(id){
  if(!confirm("Eintrag löschen?"))return;
  data=data.map(x=>x.id===id?{...x,del:true,ts:Date.now()}:x);persist();
  if(id===editId)exitEdit();else{if(editId===null)init();else render()}
}
function dl(name,text,type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();
}
$("exp").onclick=()=>dl("trainingsplan.txt",
  live().map(s=>fmt(s.date)+" (Einheit "+s.unit+")\n"+Object.entries(s.ex).map(([k,v])=>k+": "+v.split("x")[0]+" kg, Sätze: "+v.split("x")[1].replace(/-/g," · ")).join("\n")).join("\n\n"),"text/plain");

function init(){
  const t=new Date();$("date").value=new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  const L=live(),l=L[L.length-1];$("unit").value=l?(l.unit==1?2:1):1;
  $("msg").textContent="";$("note").textContent="";build();render();
}
function refresh(){if(editId!==null)exitEdit();else init()}
// Beim Zurückkehren zur Seite (z. B. am nächsten Tag): Datum/Einheit aktualisieren, sofern nichts eingegeben ist
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&editId===null&&st.every(x=>!x.reps.length))init();
});
init();
</script>
</body>
</html>
