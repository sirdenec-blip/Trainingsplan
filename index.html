#pw{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;padding:16px;overflow:auto}#pw[hidden]{display:none}#pw>div{max-width:520px;margin:4vh auto}
.wu{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:12px}.wh{font-weight:600}

#wzm{color:#c33;font-size:.85rem;min-height:1.2em;margin-top:8px}#planind{margin-bottom:2px}#fileind{margin-top:0}

.sec.dng{color:#c33;border-color:#c33}.in .pr{flex:0 0 84px;text-align:center}
.wsr{flex:0 0 100%;display:flex;gap:8px;align-items:center}

.in.g{display:grid;gap:8px;align-items:center}

.ex{padding:7px 0;border-top:1px solid var(--bd)}.ex:first-of-type{border-top:0}

/* 0.50: Logo, Verlauf-Leiste, Kompaktansicht, Notiz, Aufwärmen/Scheiben, Pausentimer, Diagramm-Tipp, Export-Erinnerung */

<script>
const VERSION="0.98";
// Übung: n = Name, m = "wr" (Gewicht + Wdh.) | "w" (nur Gewicht) | "r" (nur Wdh.) | "p" (Pyramidensatz: Gewicht je Satz, feste Wdh.),
// bw = Körpergewichtsübung, s = Anzahl Sätze (0 = beliebig viele), max/goal optional
const WKM_PLAN={name:"WKM",ts:0,units:[
  {exs:[{n:"Kniebeugen",m:"wr",s:3},{n:"Bankdrücken",m:"wr",s:3},{n:"Vorgebeugtes Rudern",m:"wr",s:3}]},
  {exs:[{n:"Kreuzheben",m:"wr",s:3},{n:"Overhead-Press",m:"wr",s:3},{n:"Klimmzüge",m:"wr",bw:true,s:0,max:12,goal:24}]}]};
function okPlan(p){return!!p&&typeof p.name==="string"&&Array.isArray(p.units)&&p.units.length>=1&&p.units.length<=6&&p.units.every(u=>u&&Array.isArray(u.exs)&&u.exs.every(e=>e&&typeof e.n==="string"&&["wr","w","r","p"].includes(e.m)))}
let plan=null;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const unitDefs=u=>(plan.units[u-1]||{exs:[]}).exs;
// Anzeigename einer Einheit: eigener Name immer mit vorangestellter Nummer („3 - Hypertrophie“), sonst „Einheit 3“
const uLab=u=>{const d=plan&&plan.units[u-1];return d&&d.name?`${u} - ${d.name}`:`Einheit ${u}`};
const defOf=(name,u)=>unitDefs(u).find(e=>e.n===name)||plan.units.flatMap(x=>x.exs).find(e=>e.n===name)||null;
// Werte: "8@60-70-80" (Pyramide: 8 Wdh., Gewichte je Satz), "85x8-9-10" (Gewicht+Wdh.), "85" (nur Gewicht), "x8-9-10" (nur Wdh.)
function parseVal(v){const a=v.indexOf("@");if(a>0)return{w:null,reps:null,pyr:{r:+v.slice(0,a),ws:v.slice(a+1).split("-").map(Number)}};const i=v.indexOf("x");if(i<0)return{w:v,reps:null};return{w:i?v.slice(0,i):null,reps:v.slice(i+1).split("-").map(Number)}}
const $=id=>document.getElementById(id);
let data=[],st=[],cur=[],dirty=false;
function sig(x){return x.date+"|"+x.unit+"|"+JSON.stringify(Object.entries(x.ex).sort())+(x.note?"|"+x.note:"")}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const newId=()=>"n"+uid();
const cmp=(a,b)=>a.date.localeCompare(b.date)||(a.ts-b.ts);
const live=()=>data.filter(x=>!x.del);

// =====================================================================================
// Speicher: mehrere Trainingspläne. Jeder Plan ist ein Dokument {app,version,plan,sessions}.
// Auf dem Gerät (localStorage) liegt immer eine Arbeitskopie; im Cloud-Modus ist Google Drive
// der Hauptspeicher (Ordner „Trainingstagebuch“, eine Datei pro Plan), abgeglichen im Hintergrund.
// =====================================================================================
// Google-OAuth-Client-ID (Typ „Webanwendung“). Leer = Drive-Anbindung ausgeblendet, nur „Ohne Cloud“ möglich.
const CLIENT_ID="134165771161-fu2co3cm28fdn1ag6eqfsdq9emqlpjoq.apps.googleusercontent.com";
const SCOPE="https://www.googleapis.com/auth/drive.file",FOLDER="Trainingstagebuch",DOCV=4;
const IKEY="ttb_index",TKEY="ttb_tok",DKEY=id=>"ttb_doc_"+id;
// idx.mode: "cloud" | "local" | null (noch nicht eingerichtet); idx.plans[id] = {id,name,n,last,fileId?,mod?,dirty?,rev?,debug?}
let idx={mode:null,active:null,plans:{}};
try{Object.assign(idx,JSON.parse(localStorage.getItem(IKEY)||"{}"))}catch(e){}
const saveIdx=()=>{try{localStorage.setItem(IKEY,JSON.stringify(idx))}catch(e){}};
const readDoc=id=>{try{const d=JSON.parse(localStorage.getItem(DKEY(id))||"null");return d&&okPlan(d.plan)&&Array.isArray(d.sessions)?d:null}catch(e){return null}};
const writeDoc=d=>{try{localStorage.setItem(DKEY(d.plan.id),JSON.stringify(d));return true}catch(e){return false}};
const docOf=()=>({app:"TTB",version:DOCV,plan,sessions:data});
function docMeta(d){const L=d.sessions.filter(x=>!x.del);return{name:d.plan.name,n:L.length,last:L.reduce((a,x)=>x.date>a?x.date:a,"")||null}}
const plans=()=>Object.values(idx.plans).sort((a,b)=>(b.last||"").localeCompare(a.last||"")||a.name.localeCompare(b.name));
const anyDirty=()=>Object.values(idx.plans).some(e=>e.dirty&&!e.debug);
const nameTaken=(n,except)=>Object.values(idx.plans).some(e=>e.id!==except&&e.name.trim().toLowerCase()===n.trim().toLowerCase());
function uniqueName(n,except){let x=n,k=2;while(nameTaken(x,except))x=n+" "+k++;return x}
function openPlan(id){const d=readDoc(id);if(!d)return false;plan=d.plan;data=d.sessions.slice().sort(cmp);idx.active=id;saveIdx();return true}
// Jede Änderung am aktiven Plan: sofort auf dem Gerät speichern, kurz danach (Cloud-Modus) nach Google Drive
function persist(){
  const e=idx.plans[plan.id]||(idx.plans[plan.id]={id:plan.id});
  Object.assign(e,docMeta(docOf()));
  if(!e.debug&&idx.mode==="cloud"){e.dirty=true;e.rev=(e.rev||0)+1}
  const ok=writeDoc(docOf());saveIdx();
  if(!ok)toast("Achtung: Gerätespeicher voll oder gesperrt – Änderung nicht gespeichert.");
  syncSoon();renderSync();return ok;
}
const savePlan=persist;
// neuen Plan anlegen und aktivieren (extra: {id, debug} für den Debug-Plan)
function newPlan(p,sessions=[],extra={}){
  plan={...clone(p),id:extra.id||uid(),name:uniqueName(p.name),ts:Date.now()};data=sessions;
  idx.plans[plan.id]={...extra,id:plan.id};idx.active=plan.id;persist();
}
function removeLocal(id){
  try{localStorage.removeItem(DKEY(id))}catch(e){}
  delete idx.plans[id];
  if(idx.active===id){idx.active=null;plan=null;data=[];const o=plans().find(p=>readDoc(p.id));if(o)openPlan(o.id)}
  saveIdx();
}
// Zusammenführen: gleiche ID = gleicher Eintrag, neuere Änderung (ts) gewinnt, Löschmarkierungen bleiben erhalten; neuerer Plan gewinnt
function mergeDocs(a,b){
  const M=new Map();[...a.sessions,...(b.sessions||[])].forEach(x=>{const o=M.get(x.id);if(!o||x.ts>o.ts)M.set(x.id,x)});
  const p=(b.plan.ts||0)>(a.plan.ts||0)?b.plan:a.plan;
  return{app:"TTB",version:DOCV,plan:{...p,id:a.plan.id},sessions:[...M.values()].sort(cmp)};
}

// ---------- Google-Anmeldung ----------
// Ohne eigenen Server gibt Google nur einen Zugang für ca. 1 Stunde. Erneuern geht nur nach einem Fingertipp
// (Anmeldefenster blitzt kurz auf); bis dahin arbeitet die App mit der Kopie auf dem Gerät weiter.
const MOCK=window.TTB_DRIVE_MOCK||null; // nur für Tests: Ersatz für Google Drive
const cloudOk=()=>!!(CLIENT_ID||MOCK);
let tok=null;try{tok=JSON.parse(localStorage.getItem(TKEY)||"null")}catch(e){}
const tokValid=()=>!!tok&&tok.exp>Date.now()+60e3;
function setTok(t,sec){tok={t,exp:Date.now()+(+sec||3600)*1e3};try{localStorage.setItem(TKEY,JSON.stringify(tok))}catch(e){}}
function dropTok(){tok=null;try{localStorage.removeItem(TKEY)}catch(e){}}
// Installierte App (Android und iPhone): Das Google-Anmeldefenster öffnet dort in einem eigenen Overlay ohne Verbindung
// zur App und bleibt am Ende weiß hängen. Deshalb dort Anmeldung per Weiterleitung im selben Fenster.
const appMode=()=>navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
const RURI=location.origin+location.pathname.replace(/index\.html$/,"");
const SKEY="ttb_st";
if(/[#&](access_token|error)=/.test(location.hash)){ // Rückkehr von der Google-Anmeldeseite (Weiterleitung)
  const h=new URLSearchParams(location.hash.slice(1)),ok=!!h.get("state")&&h.get("state")===localStorage.getItem(SKEY);
  if(ok&&h.get("access_token"))setTok(h.get("access_token"),h.get("expires_in"));
  else if(ok&&h.get("error")&&h.get("error")!=="interaction_required"&&h.get("error")!=="login_required"&&h.get("error")!=="consent_required")sessionStorage.setItem("ttb_autherr",h.get("error"));
  localStorage.removeItem(SKEY);history.replaceState(null,"",RURI);
}
let tc=null,tcWait=null;
function gisLoad(){
  if(!CLIENT_ID||MOCK||window.google&&google.accounts&&google.accounts.oauth2)return;
  const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;document.head.appendChild(s);
}
function tokenClient(){
  if(!tc&&window.google&&google.accounts&&google.accounts.oauth2)tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,
    callback:r=>{const w=tcWait;tcWait=null;if(!w)return;if(r.error)w.rej(new Error(r.error));else{setTok(r.access_token,r.expires_in);w.res()}},
    error_callback:e=>{const w=tcWait;tcWait=null;if(w)w.rej(Object.assign(new Error(e&&e.type==="popup_closed"?"Anmeldung abgebrochen":"Anmeldefenster blockiert"),{auth:true}))}});
  return tc;
}
// Google-Zugang holen – nur aus einem Klick heraus aufrufen (Browser erlauben das Anmeldefenster nur nach einem Fingertipp).
// In der installierten App: Weiterleitung (Seite lädt kurz neu, Daten sind vorher lokal gesichert); silent = ohne Rückfrage (prompt=none)
function auth(after,silent){
  if(tokValid())return Promise.resolve();
  if(MOCK)return MOCK.auth().then(t=>setTok(t,3600));
  if(appMode()){
    const s=uid();localStorage.setItem(SKEY,s);if(after)sessionStorage.setItem("ttb_after",after);
    location.href="https://accounts.google.com/o/oauth2/v2/auth?"+new URLSearchParams({client_id:CLIENT_ID,redirect_uri:RURI,response_type:"token",scope:SCOPE,include_granted_scopes:"true",state:s,
      ...(silent?{prompt:"none"}:idx.email?{}:{prompt:"select_account"}),...(idx.email?{login_hint:idx.email}:{})});
    return new Promise(()=>{});
  }
  const c=tokenClient();if(!c)return Promise.reject(new Error("Google ist gerade nicht erreichbar"));
  return new Promise((res,rej)=>{tcWait={res,rej};c.requestAccessToken({prompt:idx.email?"":"select_account",...(idx.email?{login_hint:idx.email}:{})})});
}

// ---------- Google Drive (REST) ----------
async function api(path,o={}){
  if(!tokValid())throw Object.assign(new Error("Anmeldung nötig"),{auth:true});
  const r=await fetch("https://www.googleapis.com/"+path,{...o,headers:{...(o.headers||{}),Authorization:"Bearer "+tok.t}});
  if(r.status===401){dropTok();throw Object.assign(new Error("Anmeldung abgelaufen"),{auth:true})}
  if(!r.ok)throw Object.assign(new Error("Google Drive meldet Fehler "+r.status),{status:r.status});
  return r.status===204?null:r.json();
}
const Qs=s=>encodeURIComponent(s),JH={"Content-Type":"application/json"};
const fileName=d=>(d.plan.name.replace(/[\\/:*?"<>|]/g,"").trim()||"Trainingsplan")+".json";
function drvUp(method,path,m,d){
  const b="ttb"+uid();
  return api(`upload/drive/v3/files${path}?uploadType=multipart&fields=id,modifiedTime`,{method,headers:{"Content-Type":"multipart/related; boundary="+b},
    body:`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(m)}\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(d)}\r\n--${b}--`});
}
// Jede Plan-Datei trägt die Plan-ID als appProperty „ttbPlan“ – so bleibt sie auch nach Umbenennen dieselbe Datei.
const DRV=MOCK||{
  async email(){return(await api("drive/v3/about?fields=user(emailAddress)")).user.emailAddress},
  async folder(){
    if(idx.folder)return idx.folder;
    const r=await api(`drive/v3/files?q=${Qs(`name='${FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`)}&fields=files(id)`);
    idx.folder=r.files.length?r.files[0].id:(await api("drive/v3/files?fields=id",{method:"POST",headers:JH,body:JSON.stringify({name:FOLDER,mimeType:"application/vnd.google-apps.folder"})})).id;
    saveIdx();return idx.folder;
  },
  async list(){
    const f=await this.folder(),r=await api(`drive/v3/files?q=${Qs(`'${f}' in parents and trashed=false`)}&fields=files(id,name,modifiedTime,appProperties)&pageSize=500`);
    return r.files.filter(x=>x.appProperties&&x.appProperties.ttbPlan).map(x=>({fileId:x.id,planId:x.appProperties.ttbPlan,name:x.name.replace(/\.json$/i,""),mod:x.modifiedTime}));
  },
  get:id=>api(`drive/v3/files/${id}?alt=media`),
  meta:id=>api(`drive/v3/files/${id}?fields=id,trashed`),
  async create(d){return drvUp("POST","",{name:fileName(d),parents:[await this.folder()],mimeType:"application/json",appProperties:{ttbPlan:d.plan.id}},d)},
  update:(id,d)=>drvUp("PATCH","/"+id,{name:fileName(d)},d),
  trash:id=>api(`drive/v3/files/${id}?fields=id`,{method:"PATCH",headers:JH,body:JSON.stringify({trashed:true})})
};

// ---------- Synchronisierung ----------
let syncT=null,syncing=false,again=false,netDown=false,syncErr="",lastSync=+(localStorage.getItem("ttb_last")||0);
function syncSoon(ms=1500){if(idx.mode!=="cloud")return;clearTimeout(syncT);syncT=setTimeout(syncAll,ms)}
async function syncAll(){
  clearTimeout(syncT);syncT=null;
  if(idx.mode!=="cloud"||!tokValid())return renderSync();
  if(syncing){again=true;return}
  syncing=true;renderSync();
  try{
    const rem=new Map((await DRV.list()).map(r=>[r.planId,r]));
    rem.forEach(r=>{if(!idx.plans[r.planId])idx.plans[r.planId]={id:r.planId,name:r.name,fileId:r.fileId}}); // Pläne von anderen Geräten
    for(const e of Object.values(idx.plans))if(!e.debug&&idx.plans[e.id])await syncPlan(e,rem.get(e.id));
    lastSync=Date.now();try{localStorage.setItem("ttb_last",lastSync)}catch(x){}netDown=false;syncErr="";
  }catch(x){if(x.auth)dropTok();else if(x instanceof TypeError)netDown=true;else syncErr=x.message;console.warn("Sync:",x)}
  syncing=false;saveIdx();renderSync();
  if(again){again=false;syncSoon(300)}
}
async function syncPlan(e,r){
  const rev=e.rev||0,done=()=>{if((e.rev||0)===rev)e.dirty=false};
  if(e.fileId&&!r){ // nicht (mehr) im Ordner: im Papierkorb/gelöscht – oder nur verschoben?
    let gone=false;try{gone=!!(await DRV.meta(e.fileId)).trashed}catch(x){if(x.status===404)gone=true;else throw x}
    if(gone&&!remoteGone(e))return;
  }
  if(!e.fileId){const loc=readDoc(e.id);if(!loc)return;const c=await DRV.create(loc);e.fileId=c.id;e.mod=c.modifiedTime;return done()}
  if(!e.dirty&&r&&r.mod&&e.mod===r.mod&&readDoc(e.id))return; // nichts Neues
  const remote=await DRV.get(e.fileId);

      ex={"Kreuzheben":v(80,2.5,r125),"Overhead-Press":v(30,0.75,r25),"Klimmzüge":(p>=16?"2.5":"0")+"x"+sets.join("-")};

$("wzSave").onclick=()=>{

  for(let a=0;a<wz.units.length;a++){
    const w=wz.units[a],exs=[],seen=new Set();
    for(const e of w.exs){
      const n=e.n.trim();if(!n)continue;
      if(seen.has(n.toLowerCase())){wz.cur=a;wizRender();return wzm(`${wLab(a)}: „${n}“ kommt doppelt vor.`)}
      seen.add(n.toLowerCase());
      const o={n,m:e.m};
      o.s=e.m==="wr"?(e.s??3):e.m==="p"?(e.s||3):0; // 0 = beliebig viele Sätze
      const lim=(e.m==="wr"&&(e.bw||!o.s))||e.m==="r";
      if(e.m==="wr"&&e.bw)o.bw=true;
      if(lim&&e.max)o.max=e.max;
      if(lim&&e.goal)o.goal=e.goal;
      if(e.m!=="w"&&e.rest!=null&&e.rest!==120)o.rest=e.rest; // Pause in Sekunden (Standard 120, 0 = aus)

    }
    if(!exs.length){wz.cur=a;wizRender();return wzm(`${wLab(a)}: mindestens eine Übung eintragen.`)}

    units.push(un?{name:un,exs}:{exs});
  }
  if(nameTaken(name,wzMode==="edit"?plan.id:null))return wzm(`Es gibt schon einen Plan „${name}“ – bitte einen anderen Namen wählen.`);
  if(wzMode!=="edit"){if(editId!==null)exitEdit();newPlan({name,units});$("pw").hidden=true;init();kick();toast(`Plan „${plan.name}“ angelegt.`);return}
  // Bisherige Einträge anpassen: Einheiten umnummerieren (verschoben/gelöscht), auf Wunsch umbenannte Übungen mitziehen
  const oldK=plan.units.length,newK=units.length,map={};let extra=0;
  wz.units.forEach((w,j)=>{if(w.o)map[w.o]=j+1});
  for(let o=1;o<=oldK;o++)if(map[o]==null)map[o]=newK+ ++extra; // gelöschte Einheit: Einträge bleiben, eigene Nummer hinter dem Plan
  const doRen=ren.filter(r=>{const c=live().filter(x=>x.unit===r.o&&x.ex[r.from]!=null&&x.ex[r.to]==null).length;
    return c&&confirm(`Übung „${r.from}“ heißt jetzt „${r.to}“.\n\nAuch in den ${c} bisherigen Einträgen umbenennen? Empfohlen – dann bleiben Verlauf, Bestwerte und Diagramme zusammen.\n\nOK = umbenennen\nAbbrechen = alte Einträge behalten den alten Namen`)});
  const now=Date.now();let changed=0;
  data=data.map(x=>{
    const u=x.unit>oldK?x.unit-oldK+newK+extra:map[x.unit];let ex=x.ex;
    doRen.forEach(r=>{if(x.unit===r.o&&ex[r.from]!=null&&ex[r.to]==null)ex=Object.fromEntries(Object.entries(ex).map(([k,v])=>[k===r.from?r.to:k,v]))});
    if(u===x.unit&&ex===x.ex)return x;
    changed++;return{...x,unit:u,ex,ts:now};
  }).sort(cmp);
  if(changed){ui.hf=0;saveUi()}
  plan={...plan,name,ts:now,units};savePlan();$("pw").hidden=true;refresh();kick();
  toast("Plan gespeichert"+(changed?` – ${changed} Einträge angepasst`:"")+".");
};
$("wzClose").onclick=()=>{$("pw").hidden=true};
$("plEdit").onclick=()=>wizOpen("edit");
function refresh(){if(editId!==null)exitEdit();else init()}
// Beim Zurückkehren zur Seite (z. B. am nächsten Tag): Datum/Einheit aktualisieren, sofern nichts eingegeben ist
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible"){if(syncT)syncAll();return} // beim Verlassen: Ausstehendes sofort übertragen
  if(silentRenew())return; // installierte App: Zugang still erneuern (lädt neu)
  if(idx.mode==="cloud")syncAll(); // beim Zurückkehren: Änderungen anderer Geräte holen

  if(wlWant)wlOn(); // Wake Lock wird beim Verlassen der Seite automatisch freigegeben
  tTick();
  if(plan&&editId===null&&!dirty&&st.every(x=>!x.reps.length))init();
});
// ---------- Start ----------
try{["trainingsplan_v1","trainingsplan_plan_v1","trainingsplan_file"].forEach(k=>localStorage.removeItem(k))}catch(e){} // Altbestände vor 0.90
gisLoad();
if(idx.active&&!openPlan(idx.active))idx.active=null;
init();
const after=sessionStorage.getItem("ttb_after");sessionStorage.removeItem("ttb_after");
const autherr=sessionStorage.getItem("ttb_autherr");sessionStorage.removeItem("ttb_autherr");
if(autherr)toast(autherr==="access_denied"?"Google-Anmeldung abgebrochen.":"Google-Anmeldung fehlgeschlagen ("+autherr+").");
if(after==="connect"&&tokValid())connect(); // nach Google-Weiterleitung (installierte App)
else if(!silentRenew()&&idx.mode==="cloud")syncAll();
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{}); // Gerätespeicher möglichst nicht automatisch räumen
</script>
