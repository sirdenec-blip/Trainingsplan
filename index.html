<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trainingsplan</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1c1c1a;--mu:#777;--ac:#1d6b4f;--bd:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#222221;--tx:#eee;--mu:#999;--ac:#4cc29a;--bd:#3a3a38}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;max-width:520px;margin:auto}
h1{font-size:1.3rem;margin:.2rem 0 1rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 4px}
input,select,button{font:inherit;width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input.bad{border-color:#c33}
button{background:var(--ac);color:#fff;border:0;margin-top:14px;font-weight:600}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd);margin-top:8px;font-weight:400}
.row{display:flex;gap:8px}.row>*{flex:1}
.h{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px}
.h small{color:var(--mu);font-weight:400}
.l{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
.l span:first-child{color:var(--mu)}
.x{width:auto;background:none;color:var(--mu);border:0;margin:0;padding:0 4px}
#msg{color:#c33;font-size:.85rem;min-height:1.2em;margin-top:8px}
</style>
</head>
<body>
<h1>🏋️ Trainingsplan</h1>

<div class="card">
  <div class="row">
    <div><label>Datum</label><input type="date" id="date"></div>
    <div><label>Einheit</label><select id="unit"><option value="1">Einheit 1</option><option value="2">Einheit 2</option></select></div>
  </div>
  <div id="fields"></div>
  <div id="msg"></div>
  <button id="save">Speichern</button>
</div>

<div id="hist"></div>

<div class="card">
  <button class="sec" id="exp" style="margin-top:0">Export (Textdatei)</button>
  <button class="sec" id="bak">Backup (JSON) laden / sichern</button>
  <input type="file" id="file" accept=".json" hidden>
</div>

<script>
const PLAN={1:["Kniebeugen","Bankdrücken","Vorgebeugtes Rudern"],2:["Kreuzheben","Overhead-Press","Klimmzüge"]};
const KEY="trainingsplan_v1";
let data=[];
try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const $=id=>document.getElementById(id);

// "85x8-9-10" | "85 8 9 10" | "82,5x8-9-10" -> "85x8-9-10" oder null
function parse(s){
  const n=s.trim().replace(/(\d),(\d)/g,"$1.$2").match(/\d+(\.\d+)?/g);
  if(!n||n.length!==4) return null;
  return n[0]+"x"+n.slice(1).join("-");
}
const last=(u,ex)=>{for(let i=data.length-1;i>=0;i--)if(data[i].unit==u&&data[i].ex[ex])return data[i].ex[ex]; return ""};

function build(){
  const u=$("unit").value;
  $("fields").innerHTML=PLAN[u].map((e,i)=>
    `<label>${e}</label><input id="e${i}" inputmode="text" autocomplete="off" placeholder="${last(u,e)||"85x8-9-10"}">`).join("");
}
function init(){
  const t=new Date();$("date").value=new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  const l=data[data.length-1];$("unit").value=l?(l.unit==1?2:1):1;build();render();
}
$("unit").onchange=build;

$("save").onclick=()=>{
  const u=$("unit").value,ex={};let ok=true;
  PLAN[u].forEach((e,i)=>{
    const el=$("e"+i),p=parse(el.value);
    el.classList.toggle("bad",!p);
    if(p)ex[e]=p;else ok=false;
  });
  $("msg").textContent=ok?"":"Bitte jede Übung im Format 85x8-9-10 eingeben.";
  if(!ok)return;
  data.push({id:Date.now(),date:$("date").value,unit:+u,ex});
  data.sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  save();$("unit").value=u==1?2:1;build();render();
};

const fmt=d=>d.split("-").reverse().join(".");
function render(){
  $("hist").innerHTML=[...data].reverse().map(s=>
    `<div class="card"><div class="h"><span>${fmt(s.date)} <small>Einheit ${s.unit}</small></span><button class="x" onclick="del(${s.id})">✕</button></div>`+
    Object.entries(s.ex).map(([k,v])=>`<div class="l"><span>${k}</span><span>${v}</span></div>`).join("")+`</div>`).join("");
}
function del(id){if(confirm("Eintrag löschen?")){data=data.filter(s=>s.id!==id);save();build();render()}}

function dl(name,text,type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();
}
$("exp").onclick=()=>dl("trainingsplan.txt",
  data.map(s=>fmt(s.date)+" (Einheit "+s.unit+")\n"+Object.entries(s.ex).map(([k,v])=>k+": "+v).join("\n")).join("\n\n"),"text/plain");
$("bak").onclick=()=>{
  if(confirm("OK = JSON-Backup herunterladen\nAbbrechen = Backup-Datei laden"))dl("trainingsplan-backup.json",JSON.stringify(data),"application/json");
  else $("file").click();
};
$("file").onchange=e=>{
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d)){data=d;save();init()}}catch(x){alert("Ungültige Datei")}};
  r.readAsText(e.target.files[0]);
};
init();
</script>
</body>
</html>
